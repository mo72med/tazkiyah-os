name: tazkiyah_mobile
version: 0.1.0+1
description: Tazkiyah OS mobile application.
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  isar_community: ^4.0.0-dev.14
  isar_community_flutter_libs: ^4.0.0-dev.14
  tazkiyah_core:
    path: ../../packages/core
  tazkiyah_identity:
    path: ../../packages/identity
  tazkiyah_journey:
    path: ../../packages/journey
  tazkiyah_knowledge:
    path: ../../packages/knowledge
  tazkiyah_practice:
    path: ../../packages/practice
  tazkiyah_reflection:
    path: ../../packages/reflection

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_community_generator: ^4.0.0-dev.14
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
